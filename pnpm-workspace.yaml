# pnpm blocks dependency install scripts by default. These are the ones this
# project actually needs: Prisma builds its query engine, sharp fetches the
# platform image binary Next uses for <Image>, and unrs-resolver backs the
# ESLint import resolver. Managed by `pnpm approve-builds`.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
